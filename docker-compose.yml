name: octa-bms

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octa
      POSTGRES_PASSWORD: octa
      POSTGRES_DB: octa_bms
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octa -d octa_bms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: octa
      MINIO_ROOT_PASSWORD: octa-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    profiles: ["full"]
    environment:
      DATABASE_URL: postgresql://octa:octa@postgres:5432/octa_bms
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: dev-master-key
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: octa
      S3_SECRET_KEY: octa-secret
      S3_BUCKET: octa-bms
      # local demo only — set JWT_SECRET to a random 32+ character value for real use
      JWT_SECRET: ${JWT_SECRET:-local-compose-demo-secret-not-for-production}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    profiles: ["full"]
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pg_data:
  meili_data:
  minio_data:
